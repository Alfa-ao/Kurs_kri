<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динамика курса кристаллов</title>
	<link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Курс кристаллов</h1>
            <p class="subtitle">Средние дневные значения за 2024 - 2026 гг.</p>
            <button id="resetZoom" class="reset-btn">Сбросить масштаб</button>
        </header>

        <div class="chart-wrapper">
            <div class="chart-box">
                <canvas id="crystalChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        document.write('<script src="script.js?v=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>
