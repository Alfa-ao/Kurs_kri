<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динамика курса кристаллов</title>
	<link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Курс кристаллов</h1>
            <p class="subtitle">Средние значения за 2024 - 2026 гг. Наследие Богов.</p>
            <button id="resetZoom" class="reset-btn">Сбросить масштаб</button>
        </header>
        <div class="chart-wrapper">
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <div class="loader-text">Загрузка данных...</div>
            </div>
            <div class="chart-box" id="chartBox" style="display: none;">
                <canvas id="crystalChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        document.write('<script src="script.js?v=' + Date.now() + '"><\/script>');
    </script>
</body>
</html>
